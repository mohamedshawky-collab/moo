name: Java Test Libraries

on:
  push:
    paths:
      - '.github/workflows/java-test-libs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Download test libraries
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/test-libs
          curl -fL --retry 3 -o /tmp/test-libs/junit-4.13.2.jar https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fL --retry 3 -o /tmp/test-libs/hamcrest-core-1.3.jar https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
          sha256sum /tmp/test-libs/*
      - name: Upload test libraries
        uses: actions/upload-artifact@v4
        with:
          name: java-test-libs
          path: /tmp/test-libs/
          retention-days: 1
