name: MARKET Android qualification
on:
  push:
    branches: ['codex/market-android-free-update-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-qualification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: gradle --no-daemon :app:lintRelease :app:bundleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-android-qualification
          retention-days: 1
          path: |
            app/build/reports/
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
  compatibility:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-android-api-${{ matrix.api }}
          retention-days: 1
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
