name: Build BSM MARKET Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '8.13'

      - name: Build release bundle
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload unsigned AAB
        uses: actions/upload-artifact@v4
        with:
          name: bsm-market-unsigned-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
